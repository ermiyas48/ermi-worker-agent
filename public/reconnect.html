<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ERMI — Manual ChatGPT Reconnect</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#0f1115;color:#eee;margin:0;padding:18px}
main{max-width:900px;margin:auto}
.card{background:#1a1d24;border:1px solid #30343d;border-radius:12px;padding:14px;margin:12px 0}
button{border:0;border-radius:8px;padding:10px 14px;background:#3b82f6;color:#fff;font-weight:600;margin:4px;cursor:pointer}
button.secondary{background:#2a2d35}
input{padding:10px;border-radius:8px;border:1px solid #454b57;background:#0f1115;color:#eee;width:100%;box-sizing:border-box;margin:6px 0}
#shot{width:100%;max-height:70vh;object-fit:contain;background:#000;cursor:crosshair;border-radius:10px}
.small{font-size:.86rem;color:#aeb4bf}
.ok{color:#6ee7b7}.warn{color:#fbbf24}.bad{color:#fca5a5}
</style>
</head>
<body>
<main>
<div class="card">
<h2>ERMI manual ChatGPT reconnect</h2>
<p class="small">This uses the existing Railway Chromium profile and current Termux/Pinggy proxy. It does not clear or replace cookies.</p>
<label class="small">OWNER_TOKEN</label>
<input id="token" type="password" autocomplete="off" placeholder="Paste the same owner token you already use for ERMI control"/>
<button id="start">Open ChatGPT browser</button>
<button id="restart" class="secondary">Restart browser, keep profile</button>
<button id="reload" class="secondary">Reload</button>
<div id="status" class="small">Idle</div>
</div>
<div class="card">
<img id="shot" alt="Live browser view"/>
<div>
<input id="text" type="text" placeholder="Type into the server browser"/>
<button id="type">Type</button>
<button id="enter" class="secondary">Enter</button>
<button id="clear" class="secondary">Clear</button>
<button id="up" class="secondary">Scroll ↑</button>
<button id="down" class="secondary">Scroll ↓</button>
</div>
<p class="small">Tap the screenshot to click. Complete any Cloudflare check or ChatGPT sign-in here. The browser stays on the same proxy.</p>
</div>
</main>
<script>
const tokenEl=document.getElementById('token');
const statusEl=document.getElementById('status');
const shot=document.getElementById('shot');
const textEl=document.getElementById('text');
let requestChain=Promise.resolve();
let shotUrl=null;
function headers(){return {Authorization:'Bearer '+tokenEl.value,'Content-Type':'application/json'};}
function enqueue(fn){const run=requestChain.then(fn,fn);requestChain=run.catch(()=>{});return run;}
async function call(path,method='GET',body){
  const r=await fetch(path,{method,headers:headers(),body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const err=new Error(j.error||('HTTP '+r.status));err.status=r.status;throw err;}
  return j;
}
async function loadScreenshot(){
  const r=await fetch('/reconnect/screenshot',{headers:{Authorization:'Bearer '+tokenEl.value},cache:'no-store'});
  if(!r.ok) throw new Error('Screenshot HTTP '+r.status);
  const blob=await r.blob();
  const nextUrl=URL.createObjectURL(blob);
  if(shotUrl) URL.revokeObjectURL(shotUrl);
  shotUrl=nextUrl;
  shot.src=nextUrl;
}
async function refreshOnce(){
  try{
    const j=await call('/reconnect/status');
    const cls=j.cloudflare?'warn':(j.authenticated?'ok':'small');
    statusEl.className=cls;
    statusEl.textContent=(j.cloudflare?'Cloudflare challenge: solve it here. ':j.authenticated?'Authenticated. ':'Not authenticated yet. ')
      +'state='+j.state+' url='+j.url+' proxy='+j.proxy;
    await loadScreenshot();
  }catch(e){
    statusEl.className=e.status===409?'warn':'small';
    statusEl.textContent=e.message;
  }
}
function refresh(){return enqueue(refreshOnce);}
async function action(type,extra){
  await enqueue(async()=>{
    try{await call('/reconnect/action','POST',Object.assign({type},extra||{}));await refreshOnce();}
    catch(e){statusEl.textContent=e.message;}
  });
}
document.getElementById('start').onclick=()=>enqueue(async()=>{
  try{await call('/reconnect/start','POST',{});await refreshOnce();}
  catch(e){statusEl.textContent=e.message;}
});
document.getElementById('restart').onclick=()=>action('restart');
document.getElementById('reload').onclick=()=>action('reload');
document.getElementById('type').onclick=()=>{const v=textEl.value;if(v)action('type',{text:v});};
document.getElementById('enter').onclick=()=>action('press',{key:'Enter'});
document.getElementById('clear').onclick=()=>action('type',{clear:true});
document.getElementById('up').onclick=()=>action('scroll',{dy:-400});
document.getElementById('down').onclick=()=>action('scroll',{dy:400});
shot.onclick=(ev)=>{
  const rect=shot.getBoundingClientRect();
  if(!shot.naturalWidth||!shot.naturalHeight||!rect.width||!rect.height)return;
  const x=Math.round((ev.clientX-rect.left)*(shot.naturalWidth/rect.width));
  const y=Math.round((ev.clientY-rect.top)*(shot.naturalHeight/rect.height));
  action('click',{x,y});
};
async function pollLoop(){
  if(tokenEl.value) await refresh();
  setTimeout(pollLoop,6000);
}
pollLoop();
</script>
</body>
</html>
