<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>ERMI Worker</title><style>body{font-family:system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0}button{background:#111;color:#fff;border:none;padding:.9rem 1.8rem;border-radius:10px;font-size:1rem;cursor:pointer}</style></head><body><h1>ERMI Worker</h1><p id="s">Loading…</p><button id="b">Start ERMI Worker</button><p style="font-size:.85rem;color:#666;max-width:320px;text-align:center;margin-top:1.5rem">Owner token authorizes runs. ChatGPT session lives only in the server Chromium profile.</p><script>async function p(){try{const r=await fetch("/status");const j=await r.json();document.getElementById("s").textContent=j.label||j.state;}catch(e){document.getElementById("s").textContent=e.message;}}p();setInterval(p,3000);document.getElementById("b").onclick=()=>alert("Enter OWNER_TOKEN via Authorization header on POST /run. Full UI after remaining source is pushed.");</script></body></html>
